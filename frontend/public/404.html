<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ConnVest</title>
    <script>
      // SPA redirect for GitHub Pages
      // When GitHub serves this 404.html, encode the current path into a query
      // param and redirect to the root so Angular's router can handle it.
      var pathSegmentsToKeep = 1; // keeps /connvest/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
