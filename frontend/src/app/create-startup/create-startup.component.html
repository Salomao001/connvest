<div class="max-w-5xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <div class="bg-white border border-gray-200 rounded-lg p-6 sm:p-8">
    <div class="border-b border-gray-200 pb-6 mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Criar startup</h1>
      <p class="text-sm text-gray-500 mt-1">Monte um perfil inicial para apresentar seu negocio.</p>
    </div>

    <form (ngSubmit)="createStartup()" class="grid grid-cols-1 md:grid-cols-2 gap-5" data-testid="create-startup-form">
      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Nome</span>
        <input name="name" [(ngModel)]="startupForm.name" data-testid="startup-name"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Logo</span>
        <input name="logo" [(ngModel)]="startupForm.logo" placeholder="URL do logo"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block md:col-span-2">
        <span class="text-sm font-semibold text-gray-700">Bio <span class="text-gray-400 font-normal text-xs">(tagline curto)</span></span>
        <input name="shortDescription" [(ngModel)]="startupForm.shortDescription"
          placeholder="Ex: Plataforma de crédito para pequenas empresas"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block md:col-span-2">
        <span class="text-sm font-semibold text-gray-700">Descrição</span>
        <textarea name="description" [(ngModel)]="startupForm.description" rows="4"
          placeholder="Descreva sua startup, modelo de negócio e diferenciais..."
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500"></textarea>
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Setor</span>
        <input name="sector" [(ngModel)]="startupForm.sector" placeholder="SaaS, Fintech..."
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Estagio</span>
        <select name="stage" [(ngModel)]="startupForm.stage"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
          <option value="">Nao informado</option>
          <option value="Ideia">Ideia</option>
          <option value="MVP">MVP</option>
          <option value="Primeiros usuarios">Primeiros usuarios</option>
          <option value="Receita inicial">Receita inicial</option>
          <option value="Tracao">Tracao</option>
          <option value="Escala">Escala</option>
        </select>
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Localizacao</span>
        <input name="location" [(ngModel)]="startupForm.location"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Site ou link externo</span>
        <input name="websiteUrl" [(ngModel)]="startupForm.websiteUrl"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Objetivo atual</span>
        <input name="currentObjective" [(ngModel)]="startupForm.currentObjective"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Metricas principais</span>
        <input name="mainMetrics" [(ngModel)]="startupForm.mainMetrics"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Receita mensal</span>
        <input name="monthlyRevenue" [(ngModel)]="startupForm.monthlyRevenue" placeholder="R$ 180k"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Usuarios</span>
        <input name="usersCount" type="number" [(ngModel)]="startupForm.usersCount"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Crescimento</span>
        <input name="growthPercent" [(ngModel)]="startupForm.growthPercent" placeholder="+32%"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Clientes</span>
        <input name="clientsCount" type="number" [(ngModel)]="startupForm.clientsCount"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">MRR</span>
        <input name="mrr" [(ngModel)]="startupForm.mrr" placeholder="R$ 180k"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-gray-700">Churn</span>
        <input name="churn" [(ngModel)]="startupForm.churn" placeholder="2.1%"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500">
      </label>

      <label class="md:col-span-2 inline-flex items-center gap-3 text-sm font-semibold text-gray-700">
        <input name="metricsPublic" type="checkbox" [(ngModel)]="startupForm.metricsPublic"
          class="h-4 w-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500">
        Exibir metricas publicamente
      </label>

      <div class="md:col-span-2" *ngIf="errorMessage">
        <div class="border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMessage }}</div>
      </div>

      <div class="md:col-span-2 flex flex-wrap gap-3">
        <button type="submit" [disabled]="loading" data-testid="submit-startup"
          class="inline-flex items-center justify-center px-4 py-2 bg-primary-600 text-white text-sm font-semibold rounded-md hover:bg-primary-700 disabled:opacity-60">
          {{ loading ? 'Criando...' : 'Criar startup' }}
        </button>
        <a routerLink="/profile"
          class="inline-flex items-center justify-center px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-semibold rounded-md hover:bg-gray-50">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
