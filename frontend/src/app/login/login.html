<div class="min-h-screen flex items-center justify-center bg-corporate-gray">
  <div class="max-w-md w-full bg-white p-8 border border-corporate-border shadow-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-primary-900 mb-2">CONNINVEST</h1>
      <p class="text-corporate-dark">Conectando Ideias a Capital</p>
    </div>

    <!-- Mensagem de erro -->
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded">
      {{ errorMessage }}
    </div>

    <form class="space-y-6" (ngSubmit)="onLogin()">
      <div>
        <label for="email" class="block text-sm font-medium text-corporate-dark uppercase tracking-wide">Email</label>
        <div class="mt-1">
          <input id="email" name="email" type="email" autocomplete="email" required [(ngModel)]="email"
            class="appearance-none block w-full px-3 py-2 border border-corporate-border focus:outline-none focus:ring-1 focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-corporate-dark uppercase tracking-wide">Senha</label>
        <div class="mt-1">
          <input id="password" name="password" type="password" autocomplete="current-password" required [(ngModel)]="password"
            class="appearance-none block w-full px-3 py-2 border border-corporate-border focus:outline-none focus:ring-1 focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="loading"
          class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors uppercase tracking-wide disabled:opacity-50">
          {{ loading ? 'Aguarde...' : 'Acessar Plataforma' }}
        </button>
      </div>
    </form>

    <p class="mt-6 text-center text-sm text-corporate-dark">
      Não tem conta?
      <a routerLink="/register" class="text-primary-600 font-medium hover:text-primary-500">Criar conta</a>
    </p>
  </div>
</div>
