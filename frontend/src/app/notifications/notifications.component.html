<div class="app-page-narrow">
  <header class="mb-7 flex items-center justify-between">
    <div>
      <h1 class="app-title">Notificações</h1>
      <p class="app-subtitle">Suas atividades recentes</p>
    </div>
    <button *ngIf="unreadCount > 0" (click)="markAllRead()" class="app-button-secondary text-sm">
      Marcar todas como lidas
    </button>
  </header>

  <div *ngIf="loading" class="app-card p-8 text-center text-sm text-slate-500">Carregando notificações...</div>

  <div *ngIf="!loading && notifications.length === 0" class="app-card p-10 text-center">
    <svg class="h-12 w-12 mx-auto mb-3 text-slate-200" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
    </svg>
    <h3 class="font-bold text-slate-900">Sem notificações</h3>
    <p class="mt-1 text-sm text-slate-500">Você está em dia com tudo!</p>
  </div>

  <div *ngIf="!loading && notifications.length > 0" class="app-card overflow-hidden">
    <div *ngFor="let n of notifications"
      (click)="clickNotification(n)"
      class="flex cursor-pointer items-start gap-4 border-b border-slate-100 p-4 last:border-b-0 transition-colors"
      [ngClass]="n.read ? 'bg-white hover:bg-slate-50' : 'bg-blue-50 hover:bg-blue-100'">
      <!-- Icon by type -->
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full" [ngClass]="typeColor(n.type)">
        <ng-container [ngSwitch]="n.type">
          <svg *ngSwitchCase="'LIKE'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/>
          </svg>
          <svg *ngSwitchCase="'COMMENT'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z"/>
          </svg>
          <svg *ngSwitchCase="'FOLLOW'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
          </svg>
          <svg *ngSwitchCase="'PROPOSAL'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
          </svg>
          <svg *ngSwitchCase="'MESSAGE'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
          </svg>
          <svg *ngSwitchCase="'INVITE'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.766z"/>
          </svg>
          <svg *ngSwitchDefault class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
          </svg>
        </ng-container>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <p class="font-semibold text-slate-900 text-sm">{{ n.title }}</p>
          <span *ngIf="!n.read" class="h-2 w-2 rounded-full bg-blue-700 shrink-0"></span>
        </div>
        <p class="mt-0.5 text-sm text-slate-600">{{ n.body }}</p>
        <p class="mt-1 text-xs text-slate-400">{{ timeAgo(n.createdAt) }}</p>
      </div>
    </div>
  </div>
</div>
